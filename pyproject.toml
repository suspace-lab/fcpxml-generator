[project]
name = "fcpxml-generator"
version = "0.1.0"
description = "Generate Final Cut Pro X XML (FCPXML 1.9) timeline files — a CLI tool for AI agents to produce video edit timelines importable into JianYing / Final Cut Pro / DaVinci Resolve."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [
    { name = "Auto Video Team" },
]
keywords = ["fcpxml", "video-editing", "timeline", "final-cut-pro", "jianying", "capcut", "agent-tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
fcpxml = "fcpxml_generator.cli:main"

[project.urls]
Repository = "https://github.com/exiarepairii/fcpxml-generator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
